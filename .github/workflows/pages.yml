name: Deploy web flasher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-installer/**"
      - "src/**"
      - "platformio.ini"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Assemble flasher site
        run: |
          mkdir -p site
          cp web-installer/index.html site/index.html
          cp web-installer/manifest.json site/manifest.json
          cp .pio/build/m5stickcplus2/bootloader.bin site/bootloader.bin
          cp .pio/build/m5stickcplus2/partitions.bin site/partitions.bin
          cp .pio/build/m5stickcplus2/firmware.bin site/firmware.bin

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
